[workspace]
resolver = "2"
members = ["crates/sz-core", "crates/sz-tui"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.36"
dirs = "6"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
humansize = "2"
tempfile = "3"
