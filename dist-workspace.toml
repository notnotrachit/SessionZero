[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap that receives the generated formula
tap = "notnotrachit/homebrew-tap"
# Formula name in the tap, so `brew install notnotrachit/tap/sessionzero` works
formula = "sessionzero"
# npm package name (unscoped)
npm-package = "sessionzero"
# Jobs that publish to external registries; they need HOMEBREW_TAP_TOKEN and NPM_TOKEN
publish-jobs = ["homebrew", "npm"]
